<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Silent Lamas [ASL]</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    [data-theme="dark"] {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-card: #1f2b47;
      --accent: #4ade80;
      --accent-dim: rgba(74, 222, 128, 0.12);
      --accent-glow: rgba(74, 222, 128, 0.35);
      --text-primary: #e2e8f0;
      --text-secondary: #7a8baa;
      --border: #2d3f5e;
      --danger: #ff4466;
      --toggle-bg: #2d3f5e;
      --toggle-knob: #e2e8f0;
      --shadow: rgba(0, 0, 0, 0.4);
      --webcam-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg-primary: #f5f1e8;
      --bg-secondary: #ebe7dc;
      --bg-card: #ffffff;
      --accent: #4a7a64;
      --accent-dim: rgba(74, 122, 100, 0.1);
      --accent-glow: rgba(74, 122, 100, 0.2);
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --border: #c4bfb2;
      --danger: #dc2626;
      --toggle-bg: #c4bfb2;
      --toggle-knob: #1a1a1a;
      --shadow: rgba(0, 0, 0, 0.1);
      --webcam-bg: #ddd8cb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { transition: background 0.4s ease, color 0.4s ease; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 31px, var(--border) 31px, var(--border) 32px),
        repeating-linear-gradient(90deg, transparent, transparent 31px, var(--border) 31px, var(--border) 32px);
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 32px;
      gap: 20px;
    }

    /* === HEADER === */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 3px solid var(--border);
      flex-shrink: 0;
    }

    .header-side {
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      color: var(--text-secondary);
      transition: color 0.6s;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .logo .big {
      font-size: 32px;
      color: var(--accent);
      text-shadow: 3px 3px 0px var(--accent-dim);
      transition: color 0.6s, text-shadow 0.6s;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-track {
      width: 58px;
      height: 32px;
      background: var(--toggle-bg);
      border-radius: 16px;
      position: relative;
      transition: background 0.3s;
      border: 2px solid var(--border);
    }

    .toggle-knob {
      width: 24px;
      height: 24px;
      background: var(--toggle-knob);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.3s ease, background 0.3s;
    }

    [data-theme="light"] .toggle-knob { transform: translateX(26px); }
    .toggle-icon { font-size: 18px; }

    /* === MAIN SPLIT === */
    .main {
      flex: 1;
      display: flex;
      gap: 28px;
      min-height: 0;
    }

    /* LEFT: WEBCAM */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .section-label {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      transition: color 0.4s;
      flex-shrink: 0;
    }

    .webcam-container {
      position: relative;
      flex: 1;
      background: var(--webcam-bg);
      border: 3px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 6px 6px 0px var(--shadow);
      transition: background 0.4s, border-color 0.6s, box-shadow 0.4s;
      min-height: 0;
    }

    .webcam-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .webcam-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--text-secondary);
    }

    .webcam-placeholder svg { opacity: 0.3; }

    .webcam-placeholder p {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      line-height: 1.6;
      text-align: center;
    }

    .webcam-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
    }

    .overlay-tag {
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid var(--accent);
      border-radius: 2px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      transition: border-color 0.6s, color 0.6s;
    }

    .corner-deco {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.6;
      transition: border-color 0.6s;
    }
    .corner-deco.tl { top: 6px; left: 6px; border-width: 3px 0 0 3px; }
    .corner-deco.tr { top: 6px; right: 6px; border-width: 3px 3px 0 0; }
    .corner-deco.bl { bottom: 6px; left: 6px; border-width: 0 0 3px 3px; }
    .corner-deco.br { bottom: 6px; right: 6px; border-width: 0 3px 3px 0; }

    .cam-btn {
      padding: 12px 22px;
      background: var(--accent);
      color: var(--bg-primary);
      border: 3px solid transparent;
      border-radius: 2px;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s, background 0.6s;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
    }

    .cam-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
    }

    .cam-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px rgba(0,0,0,0.3);
    }

    .cam-btn.active {
      background: var(--danger);
      color: white;
    }

    /* RIGHT: CONTROLS */
    .right-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      overflow-y: auto;
    }

    /* scrollbar styling */
    .right-panel::-webkit-scrollbar { width: 4px; }
    .right-panel::-webkit-scrollbar-track { background: transparent; }
    .right-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* === DETECTED SIGNS === */
    .detection-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 34px;
    }

    .detected-output {
      display: flex;
      align-items: center;
      padding: 20px 24px;
      background: var(--bg-card);
      border: 3px solid var(--border);
      border-radius: 4px;
      min-height: 64px;
      box-shadow: 4px 4px 0px var(--shadow);
      transition: background 0.4s, border-color 0.6s, box-shadow 0.4s;
    }

    .detected-text {
      font-family: 'Press Start 2P', cursive;
      font-size: 24px;
      color: var(--text-primary);
      letter-spacing: 4px;
      flex: 1;
      min-height: 24px;
      word-break: break-all;
      transition: color 0.4s;
    }

    .detected-text .cursor {
      display: inline-block;
      width: 14px;
      height: 24px;
      background: var(--accent);
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
      transition: background 0.6s;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* === MODE TOGGLE === */
    .mode-toggle {
      display: flex;
      gap: 0;
      border: 3px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 3px 3px 0px var(--shadow);
      transition: border-color 0.6s, box-shadow 0.4s;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 16px;
      background: var(--bg-card);
      border: none;
      color: var(--text-secondary);
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .mode-btn + .mode-btn {
      border-left: 3px solid var(--border);
    }

    .mode-btn.active {
      background: var(--accent);
      color: var(--bg-primary);
    }

    .mode-btn:hover:not(.active) {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    /* === BEAT GENERATOR === */
    .beat-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 24px;
      margin-bottom: 34px;
      border-top: 3px solid var(--border);
      transition: border-color 0.6s;
    }

    .beat-input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .beat-input {
      flex: 1;
      padding: 14px 16px;
      background: var(--bg-secondary);
      border: 3px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background 0.4s, color 0.4s;
    }

    .beat-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.5;
      font-size: 12px;
    }

    .beat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .generate-btn {
      padding: 14px 20px;
      background: var(--bg-card);
      border: 3px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      box-shadow: 3px 3px 0px var(--shadow);
    }

    .generate-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--shadow);
    }

    .generate-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--shadow);
    }

    /* === CURRENT BEAT PLAYER === */
    .beat-player {
      display: none;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 3px solid var(--border);
      border-radius: 4px;
      box-shadow: 4px 4px 0px var(--shadow);
      transition: background 0.4s, border-color 0.6s, box-shadow 0.4s;
    }

    .beat-player.visible { display: flex; }

    .play-stop-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      border: 3px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s, background 0.6s;
      flex-shrink: 0;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
    }

    .play-stop-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
    }

    .play-stop-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px rgba(0,0,0,0.3);
    }

    .play-stop-btn svg {
      fill: var(--bg-primary);
      width: 16px;
      height: 16px;
    }

    .beat-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .beat-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      color: var(--text-primary);
      transition: color 0.4s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .beat-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      transition: color 0.4s;
    }

    .vibe-tag {
      padding: 5px 10px;
      border-radius: 2px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 2px solid var(--accent);
      white-space: nowrap;
      transition: all 0.6s;
      flex-shrink: 0;
    }

    .visualizer {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 28px;
      flex-shrink: 0;
    }

    .viz-bar {
      width: 3px;
      background: var(--accent);
      opacity: 0.35;
      transition: height 0.1s, background 0.6s;
    }

    .visualizer.active .viz-bar {
      animation: viz-bounce 0.5s steps(4) infinite alternate;
      opacity: 0.85;
    }

    @keyframes viz-bounce {
      0% { height: 4px; }
      100% { height: 24px; }
    }

    .viz-bar:nth-child(1) { animation-delay: 0.00s; }
    .viz-bar:nth-child(2) { animation-delay: 0.08s; }
    .viz-bar:nth-child(3) { animation-delay: 0.16s; }
    .viz-bar:nth-child(4) { animation-delay: 0.04s; }
    .viz-bar:nth-child(5) { animation-delay: 0.12s; }
    .viz-bar:nth-child(6) { animation-delay: 0.20s; }
    .viz-bar:nth-child(7) { animation-delay: 0.06s; }
    .viz-bar:nth-child(8) { animation-delay: 0.14s; }

    /* === RECENT BEATS === */
    .recent-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 24px;
      border-top: 3px solid var(--border);
      transition: border-color 0.6s;
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recent-beat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 2px 2px 0px var(--shadow);
    }

    .recent-beat:hover {
      border-color: var(--accent);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--shadow);
    }

    .recent-beat:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    .recent-beat-number {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      color: var(--accent);
      flex-shrink: 0;
      width: 22px;
      transition: color 0.6s;
    }

    .recent-beat-info {
      flex: 1;
      min-width: 0;
    }

    .recent-beat-name {
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.4s;
    }

    .recent-beat-vibe {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      transition: color 0.4s;
    }

    .recent-beat-play {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      border-radius: 4px;
      flex-shrink: 0;
      transition: all 0.6s;
    }

    .recent-beat-play svg {
      fill: var(--accent);
      width: 10px;
      height: 10px;
      transition: fill 0.6s;
    }

    .no-recent {
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      color: var(--text-secondary);
      text-align: center;
      padding: 16px;
      opacity: 0.5;
    }

    /* === FOOTER === */
    .footer {
      text-align: left;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      color: var(--text-secondary);
      opacity: 0.4;
      letter-spacing: 1px;
      transition: color 0.4s;
      flex-shrink: 0;
      padding-top: 8px;
    }

    /* === ANIMATIONS === */
    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .fade-in:nth-child(1) { animation-delay: 0.05s; }
    .fade-in:nth-child(2) { animation-delay: 0.15s; }
    .fade-in:nth-child(3) { animation-delay: 0.25s; }

    @keyframes color-pulse {
      0% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(0.98); }
    }

    .color-shifting .logo .big {
      animation: color-pulse 0.6s ease-out;
    }

    /* === RESPONSIVE: stack on small screens === */
    @media (max-width: 800px) {
      .app {
        height: auto;
        min-height: 100vh;
      }
      .main {
        flex-direction: column;
      }
      .right-panel {
        width: 100%;
      }
      .webcam-container {
        aspect-ratio: 16 / 9;
        flex: none;
      }
      .logo { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- HEADER -->
    <header class="header fade-in">
      <div class="logo"><span class="big">A</span>ngry <span class="big">S</span>ilent <span class="big">L</span>amas</div>
      <div class="header-side">
        <div class="theme-toggle" onclick="toggleTheme()">
          <span class="toggle-icon">🌙</span>
          <div class="toggle-track"><div class="toggle-knob"></div></div>
          <span class="toggle-icon">☀️</span>
        </div>
      </div>
    </header>

    <!-- MAIN SPLIT -->
    <div class="main fade-in">

      <!-- LEFT: WEBCAM -->
      <div class="left-panel">
        <div class="section-label">Live Feed</div>
        <div class="webcam-container" id="webcamContainer">
          <div class="webcam-placeholder" id="webcamPlaceholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <p>Press start camera<br>to begin signing</p>
            <button class="cam-btn" id="camBtn" onclick="toggleCamera()">Start Camera</button>
          </div>
          <video id="webcamVideo" autoplay playsinline style="display:none;"></video>
          <canvas id="handCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>
          <div class="webcam-overlay" id="webcamOverlay" style="display:none;">
            <div class="overlay-tag">ASL Detect</div>
            <div class="overlay-tag" id="fpsTag">-- fps</div>
          </div>
          <div class="corner-deco tl" style="display:none;"></div>
          <div class="corner-deco tr" style="display:none;"></div>
          <div class="corner-deco bl" style="display:none;"></div>
          <div class="corner-deco br" style="display:none;"></div>
          <button class="cam-btn active" id="camStopBtn" onclick="toggleCamera()" style="display:none;position:absolute;bottom:10px;right:10px;">Stop Camera</button>
        </div>
      </div>

      <!-- RIGHT: CONTROLS -->
      <div class="right-panel">

        <!-- DETECTED SIGNS -->
        <section class="detection-section">
          <div class="section-label">Detected Signs</div>
          <div class="mode-toggle">
            <button class="mode-btn active" id="modeBtnLetters" onclick="setASLMode('letters')">Letters</button>
            <button class="mode-btn" id="modeBtnWords" onclick="setASLMode('words')">Words</button>
          </div>
          <div class="detected-output">
            <div class="detected-text" id="detectedText"><span class="cursor"></span></div>
          </div>
        </section>

        <!-- Hidden canvas for frame capture -->
        <canvas id="aslCanvas" width="320" height="240" style="display:none;"></canvas>

        <!-- BEAT GENERATOR -->
        <section class="beat-section">
          <div class="section-label">Beat Generator</div>
          <div class="beat-input-row">
            <input type="text" class="beat-input" id="beatInput" placeholder="Describe a beat..."/>
            <button class="generate-btn" id="generateBtn" onclick="generateBeat()">Generate</button>
          </div>
          <div class="beat-player" id="beatPlayer">
            <button class="play-stop-btn" id="playStopBtn" onclick="toggleBeat()">
              <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
              <svg id="stopIcon" viewBox="0 0 24 24" style="display:none;"><rect x="4" y="4" width="16" height="16"/></svg>
            </button>
            <div class="beat-info">
              <div class="beat-title" id="beatTitle">Generated beat</div>
              <div class="beat-subtitle" id="beatSubtitle">Ready to play</div>
            </div>
            <div class="vibe-tag" id="vibeTag" style="display:none;">chill</div>
            <div class="visualizer" id="visualizer">
              <div class="viz-bar" style="height:8px;"></div>
              <div class="viz-bar" style="height:14px;"></div>
              <div class="viz-bar" style="height:6px;"></div>
              <div class="viz-bar" style="height:20px;"></div>
              <div class="viz-bar" style="height:10px;"></div>
              <div class="viz-bar" style="height:16px;"></div>
              <div class="viz-bar" style="height:8px;"></div>
              <div class="viz-bar" style="height:12px;"></div>
            </div>
          </div>
        </section>

        <!-- RECENT BEATS -->
        <section class="recent-section">
          <div class="section-label">Recent Beats</div>
          <div class="recent-list" id="recentList">
            <div class="no-recent" id="noRecent">No beats yet — generate one!</div>
          </div>
        </section>

      </div>
    </div>

    <div class="footer fade-in">Angry Silent Lamas v1.0 — built at ADI 2026</div>
  </div>

  <script>
    // ============================================================
    // STATE
    // ============================================================
    let cameraOn = false;
    let stream = null;
    let beatPlaying = false;
    let detectedLetters = '';
    let recentBeats = []; // max 3
    let currentVibeData = null;

    // ============================================================
    // HASH-BASED VIBE COLORS — unique color per prompt, instant
    // ============================================================
    const API_BASE = 'http://localhost:8000';

    const DEFAULT_DARK  = { accent: '#4ade80', dim: 'rgba(74,222,128,0.12)', glow: 'rgba(74,222,128,0.35)' };
    const DEFAULT_LIGHT = { accent: '#4a7a64', dim: 'rgba(74,122,100,0.1)', glow: 'rgba(74,122,100,0.2)' };

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function promptToColors(prompt) {
      const h = hashString(prompt.toLowerCase()) % 360;
      // Dark mode: bright pastel (high saturation, high lightness)
      const darkAccent = `hsl(${h}, 75%, 72%)`;
      // Light mode: rich saturated (high saturation, lower lightness)
      const lightAccent = `hsl(${h}, 55%, 38%)`;
      return { darkAccent, lightAccent };
    }

    function hslToHex(hslStr) {
      const el = document.createElement('div');
      el.style.color = hslStr;
      document.body.appendChild(el);
      const rgb = getComputedStyle(el).color;
      document.body.removeChild(el);
      const [r, g, b] = rgb.match(/\d+/g).map(Number);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function makeColorSet(hex) {
      return { accent: hex, dim: hexToRgba(hex, 0.12), glow: hexToRgba(hex, 0.35) };
    }

    function applyAccent(colors) {
      const root = document.documentElement;
      root.style.setProperty('--accent', colors.accent);
      root.style.setProperty('--accent-dim', colors.dim);
      root.style.setProperty('--accent-glow', colors.glow);
      const app = document.getElementById('app');
      app.classList.add('color-shifting');
      setTimeout(() => app.classList.remove('color-shifting'), 700);
    }

    function applyVibeFromPrompt(prompt) {
      const { darkAccent, lightAccent } = promptToColors(prompt);
      const theme = document.documentElement.getAttribute('data-theme');
      const hsl = theme === 'dark' ? darkAccent : lightAccent;
      const hex = hslToHex(hsl);
      applyAccent(makeColorSet(hex));

      // Store for theme toggle
      currentVibeData = { darkAccent, lightAccent };
    }

    function reapplyCurrentVibe() {
      if (currentVibeData) {
        const theme = document.documentElement.getAttribute('data-theme');
        const hsl = theme === 'dark' ? currentVibeData.darkAccent : currentVibeData.lightAccent;
        const hex = hslToHex(hsl);
        applyAccent(makeColorSet(hex));
      } else {
        const theme = document.documentElement.getAttribute('data-theme');
        applyAccent(theme === 'dark' ? DEFAULT_DARK : DEFAULT_LIGHT);
      }
    }

    // ============================================================
    // THEME
    // ============================================================
    function toggleTheme() {
      const html = document.documentElement;
      const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('signcraft-theme', newTheme);
      reapplyCurrentVibe();
    }

    (function() {
      const saved = localStorage.getItem('signcraft-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();

    // ============================================================
    // CAMERA
    // ============================================================
    async function toggleCamera() {
      const video = document.getElementById('webcamVideo');
      const placeholder = document.getElementById('webcamPlaceholder');
      const startBtn = document.getElementById('camBtn');
      const stopBtn = document.getElementById('camStopBtn');
      const overlay = document.getElementById('webcamOverlay');
      const corners = document.querySelectorAll('.corner-deco');

      if (!cameraOn) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = stream;
          video.style.display = 'block';
          placeholder.style.display = 'none';
          stopBtn.style.display = 'block';
          overlay.style.display = 'flex';
          corners.forEach(c => c.style.display = 'block');
          cameraOn = true;
          startFpsCounter();
          startASLDetection();
        } catch (err) {
          alert('Could not access camera. Please allow camera permissions.');
          console.error(err);
        }
      } else {
        stopASLDetection();
        stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        video.style.display = 'none';
        placeholder.style.display = 'flex';
        stopBtn.style.display = 'none';
        overlay.style.display = 'none';
        corners.forEach(c => c.style.display = 'none');
        cameraOn = false;
      }
    }

    let aslFramesReceived = 0;
    let aslFpsLastTime = performance.now();

    function updateAslFps() {
      aslFramesReceived++;
      const now = performance.now();
      if (now - aslFpsLastTime >= 1000) {
        document.getElementById('fpsTag').textContent = aslFramesReceived + ' fps';
        aslFramesReceived = 0;
        aslFpsLastTime = now;
      }
    }

    function startFpsCounter() {
      document.getElementById('fpsTag').textContent = '-- fps';
    }

    // ============================================================
    // ASL DETECTION — WebSocket client + display
    // ============================================================
    let aslSocket = null;
    let aslMode = 'letters';
    let isDetecting = false;
    let frameLoopTimer = null;

    function showDetection(text) {
      document.getElementById('detectedText').innerHTML =
        text + '<span class="cursor"></span>';
    }

    function startASLDetection() {
      if (aslSocket) return;
      const video = document.getElementById('webcamVideo');
      if (!video.srcObject) return;

      aslSocket = new WebSocket('ws://localhost:8000/ws/asl');

      aslSocket.onopen = () => {
        isDetecting = true;
        sendFrameLoop();
      };

      aslSocket.onmessage = (event) => {
        handleASLMessage(event);
      };

      aslSocket.onerror = (err) => {
        console.error('ASL WebSocket error:', err);
      };

      aslSocket.onclose = () => {
        isDetecting = false;
        aslSocket = null;
        if (frameLoopTimer) {
          clearTimeout(frameLoopTimer);
          frameLoopTimer = null;
        }
      };
    }

    function stopASLDetection() {
      isDetecting = false;
      if (frameLoopTimer) {
        clearTimeout(frameLoopTimer);
        frameLoopTimer = null;
      }
      if (aslSocket) {
        try { aslSocket.send(JSON.stringify({ action: 'stop' })); } catch(e) {}
        aslSocket.close();
        aslSocket = null;
      }
    }

    function sendFrameLoop() {
      if (!isDetecting || !aslSocket || aslSocket.readyState !== WebSocket.OPEN) return;

      const video = document.getElementById('webcamVideo');
      const canvas = document.getElementById('aslCanvas');
      const ctx = canvas.getContext('2d');

      ctx.drawImage(video, 0, 0, 320, 240);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

      aslSocket.send(JSON.stringify({
        action: 'frame',
        data: dataUrl,
      }));

      frameLoopTimer = setTimeout(sendFrameLoop, 66); // ~15fps
    }

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17],
    ];

    function drawHandLandmarks(landmarks) {
      const canvas = document.getElementById('handCanvas');
      const container = document.getElementById('webcamContainer');
      const w = container.clientWidth;
      const h = container.clientHeight;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);

      if (!landmarks || landmarks.length === 0) return;

      // Draw connections
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 2;
      for (const [i, j] of HAND_CONNECTIONS) {
        const [x1, y1] = landmarks[i];
        const [x2, y2] = landmarks[j];
        ctx.beginPath();
        ctx.moveTo(x1 * w, y1 * h);
        ctx.lineTo(x2 * w, y2 * h);
        ctx.stroke();
      }

      // Draw joints
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent');
      for (const [x, y] of landmarks) {
        ctx.beginPath();
        ctx.arc(x * w, y * h, 5, 0, Math.PI * 2);
        ctx.fillStyle = accentColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function handleASLMessage(event) {
      const msg = JSON.parse(event.data);

      if (msg.type === 'status') {
        updateAslFps();
        if (msg.landmarks) {
          drawHandLandmarks(msg.landmarks);
        } else {
          drawHandLandmarks(null);
        }
      }

      if (msg.type === 'detection') {
        if (msg.kind === 'letter') {
          showDetection(msg.value);
        } else if (msg.kind === 'word') {
          showDetection(msg.word || msg.value);
        }
      }
    }

    function setASLMode(mode) {
      aslMode = mode;

      // Update toggle UI
      document.getElementById('modeBtnLetters').classList.toggle('active', mode === 'letters');
      document.getElementById('modeBtnWords').classList.toggle('active', mode === 'words');

      // Tell backend
      if (aslSocket && aslSocket.readyState === WebSocket.OPEN) {
        aslSocket.send(JSON.stringify({ action: 'set_mode', mode: mode }));
      }
    }

    // ============================================================
    // STREAMING BEAT ENGINE (WebSocket + Web Audio API)
    // ============================================================
    const WS_URL = 'ws://localhost:8000/ws/beat';
    let beatSocket = null;
    let audioCtx = null;
    let scriptNode = null;
    let audioQueue = [];       // queue of Float32 sample arrays
    let queueReadOffset = 0;   // offset into first chunk in queue
    let currentPrompt = '';
    let isStreaming = false;    // gate for incoming audio data

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000,
        });
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function pcm16ToFloat32Stereo(pcmBytes) {
      // PCM 16-bit LE stereo → two Float32 channels
      const int16 = new Int16Array(
        pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength / 2
      );
      const samples = int16.length / 2; // stereo
      const left = new Float32Array(samples);
      const right = new Float32Array(samples);
      for (let i = 0; i < samples; i++) {
        left[i] = int16[i * 2] / 32768;
        right[i] = int16[i * 2 + 1] / 32768;
      }
      return { left, right };
    }

    function startAudioPlayback() {
      ensureAudioContext();

      // ScriptProcessorNode pulls from our queue
      if (scriptNode) {
        scriptNode.disconnect();
      }

      const bufferSize = 4096;
      scriptNode = audioCtx.createScriptProcessor(bufferSize, 0, 2);

      scriptNode.onaudioprocess = (e) => {
        const outL = e.outputBuffer.getChannelData(0);
        const outR = e.outputBuffer.getChannelData(1);
        let written = 0;

        while (written < bufferSize && audioQueue.length > 0) {
          const chunk = audioQueue[0];
          const available = chunk.left.length - queueReadOffset;
          const needed = bufferSize - written;
          const toCopy = Math.min(available, needed);

          outL.set(chunk.left.subarray(queueReadOffset, queueReadOffset + toCopy), written);
          outR.set(chunk.right.subarray(queueReadOffset, queueReadOffset + toCopy), written);

          written += toCopy;
          queueReadOffset += toCopy;

          if (queueReadOffset >= chunk.left.length) {
            audioQueue.shift();
            queueReadOffset = 0;
          }
        }

        // Fill remaining with silence if queue is empty
        if (written < bufferSize) {
          outL.fill(0, written);
          outR.fill(0, written);
        }
      };

      scriptNode.connect(audioCtx.destination);
    }

    function stopAudioPlayback() {
      isStreaming = false;
      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode = null;
      }
      audioQueue = [];
      queueReadOffset = 0;
      if (audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend();
      }
    }

    function connectBeatSocket(prompt, bpm) {
      // Kill everything from previous connection
      isStreaming = false;
      if (beatSocket) {
        beatSocket.onmessage = null; // prevent any more handlers firing
        beatSocket.close();
        beatSocket = null;
      }

      stopAudioPlayback();

      beatSocket = new WebSocket(WS_URL);

      beatSocket.onopen = () => {
        beatSocket.send(JSON.stringify({
          action: 'start',
          prompt: prompt,
          bpm: bpm,
        }));
      };

      beatSocket.onmessage = (event) => {
        if (typeof event.data === 'string') {
          const msg = JSON.parse(event.data);
          const subtitle = document.getElementById('beatSubtitle');
          if (msg.type === 'status') {
            if (msg.message === 'connecting') {
              subtitle.textContent = 'Connecting to Lyria...';
            } else if (msg.message === 'streaming') {
              subtitle.textContent = 'Streaming live...';
              isStreaming = true;
              startAudioPlayback();
              setPlayerUI(true);
            } else if (msg.message === 'stopped') {
              subtitle.textContent = 'Stopped';
            } else if (msg.message === 'updated') {
              subtitle.textContent = 'Streaming live...';
            }
          } else if (msg.type === 'error') {
            subtitle.textContent = 'Error: ' + msg.message;
            console.error('Beat error:', msg.message);
          }
        } else if (isStreaming) {
          // Only queue audio if we're still streaming
          event.data.arrayBuffer().then((buf) => {
            if (!isStreaming) return; // double-check after async
            const pcm = new Uint8Array(buf);
            const decoded = pcm16ToFloat32Stereo(pcm);
            audioQueue.push(decoded);
          });
        }
      };

      beatSocket.onerror = (err) => {
        console.error('WebSocket error:', err);
        document.getElementById('beatSubtitle').textContent = 'Connection error';
      };

      beatSocket.onclose = () => {
        // If it closes unexpectedly while playing, update UI
        if (beatPlaying) {
          setPlayerUI(false);
          beatPlaying = false;
        }
      };
    }

    function setPlayerUI(playing) {
      const playIcon = document.getElementById('playIcon');
      const stopIcon = document.getElementById('stopIcon');
      const viz = document.getElementById('visualizer');

      if (playing) {
        playIcon.style.display = 'none';
        stopIcon.style.display = 'block';
        viz.classList.add('active');
      } else {
        playIcon.style.display = 'block';
        stopIcon.style.display = 'none';
        viz.classList.remove('active');
      }
    }

    // ============================================================
    // BEAT GENERATOR — public functions called by UI
    // ============================================================
    function generateBeat() {
      const input = document.getElementById('beatInput').value.trim();
      if (!input) return;

      const player = document.getElementById('beatPlayer');
      const title = document.getElementById('beatTitle');
      const vibeTag = document.getElementById('vibeTag');

      vibeTag.style.display = 'none';

      // Instant color shift from prompt hash
      applyVibeFromPrompt(input);

      player.classList.add('visible');
      title.textContent = '"' + input + '"';
      currentPrompt = input;
      beatPlaying = true;

      connectBeatSocket(input, 120);

      addRecentBeat(input);
      document.getElementById('beatInput').value = '';
    }

    function toggleBeat() {
      const subtitle = document.getElementById('beatSubtitle');

      if (beatPlaying) {
        // Kill everything immediately
        beatPlaying = false;
        isStreaming = false;

        if (beatSocket) {
          beatSocket.onmessage = null; // prevent queued data from arriving
          try { beatSocket.send(JSON.stringify({ action: 'stop' })); } catch(e) {}
          beatSocket.close();
          beatSocket = null;
        }

        stopAudioPlayback();
        setPlayerUI(false);
        subtitle.textContent = 'Stopped';
      } else {
        if (!currentPrompt) return;
        beatPlaying = true;
        connectBeatSocket(currentPrompt, 120);
      }
    }

    // ============================================================
    // RECENT BEATS
    // ============================================================
    function addRecentBeat(prompt) {
      recentBeats.unshift({ prompt });
      if (recentBeats.length > 3) recentBeats.pop();
      renderRecentBeats();
    }

    function renderRecentBeats() {
      const list = document.getElementById('recentList');

      if (recentBeats.length === 0) {
        list.innerHTML = '<div class="no-recent">No beats yet — generate one!</div>';
        return;
      }

      list.innerHTML = recentBeats.map((beat, i) => `
        <div class="recent-beat" onclick="loadRecentBeat(${i})">
          <div class="recent-beat-number">${i + 1}.</div>
          <div class="recent-beat-info">
            <div class="recent-beat-name">${beat.prompt}</div>
          </div>
          <div class="recent-beat-play">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
      `).join('');
    }

    function loadRecentBeat(index) {
      const beat = recentBeats[index];
      if (!beat) return;

      const player = document.getElementById('beatPlayer');
      const title = document.getElementById('beatTitle');
      const vibeTag = document.getElementById('vibeTag');

      vibeTag.style.display = 'none';
      applyVibeFromPrompt(beat.prompt);

      player.classList.add('visible');
      title.textContent = '"' + beat.prompt + '"';
      currentPrompt = beat.prompt;
      beatPlaying = true;

      connectBeatSocket(beat.prompt, 120);
    }
  </script>
</body>
</html>
