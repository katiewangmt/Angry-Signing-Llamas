services:
  - type: web
    name: signcraft
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd test-backend && python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
