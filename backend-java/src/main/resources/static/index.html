<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL Freestyle — Camera + Music</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    h1 { font-size: 1.25rem; margin-top: 0; }
    .layout {
      display: grid;
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .camera-section {
      background: #252540;
      border-radius: 12px;
      padding: 1rem;
      overflow: hidden;
    }
    .camera-section h2 { font-size: 1rem; margin: 0 0 0.5rem 0; color: #b8b8d0; }
    .camera-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: #000;
      border-radius: 8px;
      aspect-ratio: 4/3;
    }
    .camera-wrap video,
    .camera-wrap canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }
    .camera-wrap video { object-fit: cover; transform: scaleX(-1); }
    .camera-wrap canvas { transform: scaleX(-1); pointer-events: none; }
    .controls { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #3d3d5c;
      color: #eee;
      cursor: pointer;
    }
    button:hover { background: #4d4d6c; }
    button.primary { background: #0f9d58; color: #fff; }
    button.primary:hover { background: #0b8046; }
    button.danger { background: #c53030; color: #fff; }
    button.danger:hover { background: #9b2222; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 0.5rem; font-size: 0.9rem; color: #888; min-height: 1.5em; }
    .music-section {
      background: #252540;
      border-radius: 12px;
      padding: 1rem;
    }
    .music-section h2 { font-size: 1rem; margin: 0 0 0.5rem 0; color: #b8b8d0; }
    .hint { font-size: 0.85rem; color: #666; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="layout">
    <h1>ASL Freestyle — Camera + Music</h1>

    <section class="camera-section">
      <h2>Camera & hand landmarks</h2>
      <div class="camera-wrap">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
      <div class="controls">
        <button id="startCameraBtn" class="primary">Start camera</button>
        <button id="stopCameraBtn" disabled class="danger">Stop camera</button>
      </div>
      <div id="cameraStatus">Click “Start camera” and allow access when prompted.</div>
    </section>

    <section class="music-section">
      <h2>Random music</h2>
      <div class="controls">
        <button id="playBtn" class="primary">Play random music</button>
        <button id="pauseBtn" disabled>Pause</button>
      </div>
      <div id="status">Click “Play random music” to start.</div>
      <p class="hint">Open this page at <strong>http://localhost:5000</strong> (this server).</p>
    </section>
  </div>

  <script type="module">
    const API_BASE = "";
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startCameraBtn = document.getElementById("startCameraBtn");
    const stopCameraBtn = document.getElementById("stopCameraBtn");
    const cameraStatusEl = document.getElementById("cameraStatus");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const statusEl = document.getElementById("status");

    let stream = null;
    let handLandmarker = null;
    let lastVideoTime = -1;
    let animationId = null;
    let audio = null;
    let currentUrl = null;

    async function initHandLandmarker() {
      const { HandLandmarker, FilesetResolver } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        },
        numHands: 1,
        runningMode: "VIDEO",
        minHandDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5,
      });
    }

    function drawLandmarks(landmarks) {
      if (!landmarks || !landmarks.length) return;
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = "#00ff88";
      ctx.strokeStyle = "#00cc66";
      ctx.lineWidth = 2;
      for (const lm of landmarks) {
        const x = lm.x * w;
        const y = lm.y * h;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      const connections = [
        [0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8],
        [0, 9], [9, 10], [10, 11], [11, 12], [0, 13], [13, 14], [14, 15], [15, 16],
        [0, 17], [17, 18], [18, 19], [19, 20], [5, 9], [9, 13], [13, 17],
      ];
      ctx.strokeStyle = "rgba(0, 255, 136, 0.6)";
      for (const [i, j] of connections) {
        if (landmarks[i] && landmarks[j]) {
          ctx.beginPath();
          ctx.moveTo(landmarks[i].x * w, landmarks[i].y * h);
          ctx.lineTo(landmarks[j].x * w, landmarks[j].y * h);
          ctx.stroke();
        }
      }
    }

    function detectAndDraw() {
      if (!video.srcObject || !handLandmarker || video.readyState < 2) {
        animationId = requestAnimationFrame(detectAndDraw);
        return;
      }
      if (video.currentTime !== lastVideoTime) {
        try {
          const result = handLandmarker.detectForVideo(video, performance.now());
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (result.landmarks && result.landmarks.length > 0) {
            for (const hand of result.landmarks) {
              drawLandmarks(hand);
            }
            cameraStatusEl.textContent = "Hand detected — 21 landmarks";
          } else {
            cameraStatusEl.textContent = "Camera on. Show your hand.";
          }
        } catch (e) {
          cameraStatusEl.textContent = "Detection: " + (e.message || "error");
        }
        lastVideoTime = video.currentTime;
      }
      animationId = requestAnimationFrame(detectAndDraw);
    }

    startCameraBtn.addEventListener("click", async () => {
      startCameraBtn.disabled = true;
      cameraStatusEl.textContent = "Starting camera and loading hand model…";
      try {
        if (!handLandmarker) await initHandLandmarker();
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        lastVideoTime = -1;
        detectAndDraw();
        stopCameraBtn.disabled = false;
        cameraStatusEl.textContent = "Camera on. Show your hand.";
      } catch (err) {
        cameraStatusEl.textContent = "Error: " + (err.message || "Camera or model failed. Allow camera access.");
        startCameraBtn.disabled = false;
      }
    });

    stopCameraBtn.addEventListener("click", () => {
      if (animationId) cancelAnimationFrame(animationId);
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      startCameraBtn.disabled = false;
      stopCameraBtn.disabled = true;
      cameraStatusEl.textContent = "Camera off. Click “Start camera” to try again.";
    });

    playBtn.addEventListener("click", async () => {
      playBtn.disabled = true;
      statusEl.textContent = "Generating music…";
      try {
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        const res = await fetch(API_BASE + "/api/random-music");
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const blob = await res.blob();
        currentUrl = URL.createObjectURL(blob);
        audio = new Audio(currentUrl);
        audio.addEventListener("ended", () => {
          pauseBtn.disabled = true;
          statusEl.textContent = "Finished. Click Play again for new music.";
          playBtn.disabled = false;
        });
        audio.addEventListener("error", () => {
          statusEl.textContent = "Playback error.";
          playBtn.disabled = false;
          pauseBtn.disabled = true;
        });
        await audio.play();
        pauseBtn.disabled = false;
        statusEl.textContent = "Playing. Use Pause to pause.";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        pauseBtn.disabled = true;
      }
      playBtn.disabled = false;
    });

    pauseBtn.addEventListener("click", () => {
      if (!audio) return;
      if (audio.paused) {
        audio.play();
        pauseBtn.textContent = "Pause";
        statusEl.textContent = "Playing.";
      } else {
        audio.pause();
        pauseBtn.textContent = "Resume";
        statusEl.textContent = "Paused.";
      }
    });
  </script>
</body>
</html>
